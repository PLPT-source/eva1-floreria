{% extends 'floreriaapp/base.html' %}
{% block titulo %}{{ producto.nombre }}{% endblock %}
{% block contenido %}
<div class="card mx-auto" style="max-width:640px"><div class="card-body">
    <h2> {{ producto.nombre }}</h2>
    <dl class="row mt-3">
        <dt class="col-sm-4">ID</dt><dd class="col-sm-8">{{ producto.id }}</dd>
        <dt class="col-sm-4">Precio</dt><dd class="col-sm-8">${{ producto.precio }}</dd>
        <dt class="col-sm-4">Stock</dt><dd class="col-sm-8">{{ producto.stock }}</dd>
    </dl>
    <a href="{% url 'editar_producto' producto.id %}" class="btn btn-warning"> Editar</a>
    <a href="{% url 'listar_productos' %}" class="btn btn-link">← Volver</a>
</div></div>
{% endblock %}
