{% extends 'floreriaapp/base.html' %}
{% block titulo %}Editar producto{% endblock %}
{% block contenido %}
<div class="card shadow-sm mx-auto" style="max-width:640px"><div class="card-body">
    <h2 class="mb-3">✏️ Editar: {{ producto.nombre }}</h2>
    <form method="post" novalidate>
        {% csrf_token %}
        {% include 'floreriaapp/_campos.html' %}
        <button class="btn btn-warning">Guardar cambios</button>
        <a href="{% url 'listar_productos' %}" class="btn btn-link">Cancelar</a>
    </form>
</div></div>
{% endblock %}
