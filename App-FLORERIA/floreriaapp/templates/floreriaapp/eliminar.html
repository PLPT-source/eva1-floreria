{% extends 'floreriaapp/base.html' %}
{% block titulo %}Eliminar producto{% endblock %}
{% block contenido %}
<div class="card mx-auto" style="max-width:640px"><div class="card-body">
    <h2>🗑️ Eliminar producto</h2>
    <p>¿Estás seguro de que quieres eliminar <strong>{{ producto.nombre }}</strong>? Esta acción no se puede deshacer.</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'listar_productos' %}" class="btn btn-link">Cancelar</a>
    </form>
</div></div>
{% endblock %}
