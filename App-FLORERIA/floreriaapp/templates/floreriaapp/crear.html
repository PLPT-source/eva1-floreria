{% extends 'floreriaapp/base.html' %}
{% block titulo %}Crear producto{% endblock %}
{% block contenido %}
<div class="card mx-auto" style="max-width:640px"><div class="card-body">
    <h2 class="mb-3">Crear nuevo producto</h2>
    <form method="post" novalidate>
        {% csrf_token %}
        {% include 'floreriaapp/_campos.html' %}
        <button class="btn btn-primary">Guardar producto</button>
        <a href="{% url 'listar_productos' %}" class="btn btn-link">Cancelar</a>
    </form>
</div></div>
{% endblock %}
